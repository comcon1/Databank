name: Intensive Weekly Tests

on:
  schedule:
    # Runs every Monday at 12:00 UTC
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  tests-package:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python-version: ["3.10", "3.13"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install GROMACS (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gromacs

    - name: Install GROMACS (macOS)
      if: runner.os == 'macOS'
      run: brew install gromacs

    - name: Install GROMACS (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = '2024.4'
        $installer = Join-Path $env:RUNNER_TEMP "GROMACS-$version-AMD64.exe"
        $url = "https://ftp.gromacs.org/gromacs/windows/GROMACS-$version-AMD64.exe"
        Invoke-WebRequest -Uri $url -OutFile $installer
        if ((Get-Item $installer).Length -lt 1MB) {
          throw "The GROMACS installer download is unexpectedly small."
        }
        Start-Process -FilePath $installer -ArgumentList '/S' -Wait -NoNewWindow
        $gmx = Get-ChildItem 'C:\Program Files\Gromacs*\bin\gmx.exe' -ErrorAction SilentlyContinue |
          Select-Object -First 1
        if (-not $gmx) {
          throw 'GROMACS was not installed in the expected location.'
        }
        Split-Path $gmx.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        check-latest: true

    - run: python -m pip install tox coverage[toml]

    - name: run Python tests
      run: |
        tox -e tests-package

  tests-develop:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.10", "3.13"]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        check-latest: true

    - run: python -m pip install tox

    - name: run develop (out-of-package) tests
      run: |
        tox -e tests-develop
